<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Glowden: «тёплое логово». Контур домика складывается в букву G,
       внутри — светящийся уголёк, вокруг — тёплое сияние. -->
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a2150"/>
      <stop offset="1" stop-color="#170d24"/>
    </linearGradient>
    <radialGradient id="halo" cx="30" cy="40" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff8a3d" stop-opacity=".75"/>
      <stop offset=".45" stop-color="#ff6b2c" stop-opacity=".28"/>
      <stop offset="1" stop-color="#ff6b2c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#ff6b2c"/>
    </linearGradient>
    <radialGradient id="ember" cx="29" cy="39" r="6.5" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffbea"/>
      <stop offset=".45" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#ff7a2f"/>
    </radialGradient>
  </defs>

  <!-- Ночной фон и сияние из «логова» -->
  <rect width="64" height="64" rx="16" fill="url(#night)"/>
  <rect width="64" height="64" rx="16" fill="url(#halo)"/>

  <!-- Домик-G: крыша, стены, а правая стена уходит внутрь перекладиной буквы G -->
  <path d="M47 26 32 14 17 26v17.5a6.5 6.5 0 0 0 6.5 6.5h17a6.5 6.5 0 0 0 6.5-6.5V37H37"
        fill="none" stroke="url(#warm)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Уголёк: мягкий ореол и яркая сердцевина -->
  <circle cx="29" cy="39" r="9" fill="#ffb347" opacity=".3"/>
  <circle cx="29" cy="39" r="5.5" fill="url(#ember)"/>
</svg>
